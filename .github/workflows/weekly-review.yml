name: Weekly training review

# Fires Saturday 11:00 America/New_York. GitHub cron is UTC and has no DST, so we
# schedule BOTH 15:00 and 16:00 UTC so one of them is 11:00 Eastern: 15:00 UTC = 11:00 EDT
# (summer), 16:00 UTC = 11:00 EST (winter). The in-script Eastern guard picks the first
# firing at/after 11:00 local and no-ops the rest against the week's snapshot file.
#
# A firing that arrives late still ships: the guard takes the first Saturday firing at
# or after 11:00 local, so the 3h+ delays seen on 2026-08-29 (14:10 and 15:20 ET) are no
# longer fatal. A week that gets no review at all is caught afterwards by missed_weeks().
#
# Manual runs use workflow_dispatch and default to bypassing the guard.
on:
  schedule:
    - cron: "0 15 * * 6"
    - cron: "0 16 * * 6"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the Sat-11:00-ET time guard"
        type: boolean
        default: true
      review_date:
        description: "Review the week containing this date (YYYY-MM-DD). Blank = today."
        type: string
        default: ""
      reconcile_report_only:
        description: "Report load drift only — do not edit the plan or push the Sheet"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch tip, not the event SHA. A scheduled run pins to the tip as of
          # scheduling time, so a firing queued behind a delayed one would check out a
          # tree from before that run pushed its snapshot — and re-send the review it
          # is supposed to skip. The concurrency group serialises; it does not refresh.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run weekly review
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Weekly load sync writes the corrected plan back to the Sheet. Without these
          # the review still ships and the block JSON is still corrected — only the
          # Sheet push is skipped, with a warning in the job log.
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEETS_SPREADSHEET_ID: ${{ secrets.SHEETS_SPREADSHEET_ID }}
          # Via env, not ${{ }} interpolated into the script: a dispatch input spliced
          # straight into a shell line is a command-injection seam, and the validation
          # below can only do its job if the value reaches the shell as data.
          REVIEW_DATE: ${{ inputs.review_date }}
          RECONCILE_REPORT: ${{ inputs.reconcile_report_only }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          if [ -n "$REVIEW_DATE" ]; then
            case "$REVIEW_DATE" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
                ARGS="$ARGS --date $REVIEW_DATE" ;;
              *)
                echo "review_date must be YYYY-MM-DD, got: $REVIEW_DATE" >&2
                exit 1 ;;
            esac
          fi
          if [ "$RECONCILE_REPORT" = "true" ]; then
            ARGS="$ARGS --reconcile-report"
          fi
          echo "Running: weekly_review $ARGS"
          python -m scripts.review.weekly_review $ARGS
