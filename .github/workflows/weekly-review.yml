name: Weekly training review

# Fires Saturday 11:00 America/New_York. GitHub cron is UTC and has no DST, so we
# schedule BOTH 15:00 and 16:00 UTC so one of them is 11:00 Eastern: 15:00 UTC = 11:00 EDT
# (summer), 16:00 UTC = 11:00 EST (winter). The in-script Eastern guard picks the first
# firing at/after 11:00 local and no-ops the rest against the week's snapshot file.
#
# The 20:00 UTC entry is a backstop, and it exists because scheduled runs are best-effort:
# GitHub queues them behind runner load and can delay them by hours or skip them outright.
# On 2026-08-29 both firings landed 3+ hours late (14:10 and 15:20 ET). Under the old
# exact-hour guard that dropped the review silently; under the snapshot guard a late or
# extra firing is a ~20s no-op, so a backstop costs almost nothing and buys a second
# chance at actually shipping.
#
# Manual runs use workflow_dispatch and default to bypassing the guard.
on:
  schedule:
    - cron: "0 15 * * 6"
    - cron: "0 16 * * 6"
    - cron: "0 20 * * 6"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the Sat-11:00-ET time guard"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: weekly-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run weekly review
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Weekly load sync writes the corrected plan back to the Sheet. Without these
          # the review still ships and the block JSON is still corrected — only the
          # Sheet push is skipped, with a warning in the job log.
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEETS_SPREADSHEET_ID: ${{ secrets.SHEETS_SPREADSHEET_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          python -m scripts.review.weekly_review $ARGS
