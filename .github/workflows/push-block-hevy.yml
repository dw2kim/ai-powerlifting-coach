name: Push block to Hevy

# Manual: creates a Hevy routine folder named after the block id, then one routine per
# (week, day) inside it — 20 routines for a standard 5-week / 4-day block.
#
# Exists for the same reason as export-block.yml: a block is authored in a Claude Code
# session that has no HEVY_API_KEY, so it needs a credentialled place to run from.
#
# A plain push is additive. For a live block, `update: true` and `start: W<n>-D<n>`
# overwrite matching routines in place while preserving already-trained sessions.
#
# `apply` defaults to false: the safe click is a dry run, and writing is a deliberate second
# action.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually write to Hevy (leave OFF for a dry run first)"
        type: boolean
        default: false
      week:
        description: "Push a single week only (1-5). Blank = all weeks."
        type: string
        default: ""
      update:
        description: "Correct a LIVE block: overwrite matching routines (PUT) instead of adding duplicates"
        type: boolean
        default: false
      start:
        description: "Start from this session, e.g. W4-D1. Leaves already-trained sessions untouched."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Never let two pushes overlap — a duplicated folder is annoying to unpick by hand.
  group: push-block-hevy
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Push
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          APPLY: ${{ inputs.apply }}
          WEEK: ${{ inputs.week }}
          UPDATE: ${{ inputs.update }}
          START: ${{ inputs.start }}
        run: |
          args=()
          [ "$APPLY" = "true" ] && args+=(--apply)
          [ -n "$WEEK" ] && args+=(--week "$WEEK")
          [ "$UPDATE" = "true" ] && args+=(--update)
          [ -n "$START" ] && args+=(--start "$START")

          if [ "$UPDATE" = "true" ] && [ -z "$START" ]; then
            echo "::error::Update mode requires a start session so trained routines are preserved."
            exit 1
          fi
          if [ -n "$START" ] && [ "$UPDATE" != "true" ]; then
            echo "::error::A start session is only safe in update mode."
            exit 1
          fi

          if [ "$APPLY" = "true" ]; then
            if [ "$UPDATE" = "true" ]; then
              echo "::warning::Writing to Hevy for real, in UPDATE mode — overwrites matching routines in place."
            else
              echo "::warning::Writing to Hevy for real, ADDITIVE — re-running duplicates the folder. For a live block use update:true."
            fi
          else
            echo "Dry run — no Hevy calls. Flip 'apply' on to write."
          fi
          printf 'Running: python -m scripts.hevy.push_block'
          printf ' %q' "${args[@]}"
          printf '\n'
          python -m scripts.hevy.push_block "${args[@]}"
