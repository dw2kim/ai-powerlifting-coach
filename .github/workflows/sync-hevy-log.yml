name: Sync Hevy log (training days)

# Pulls Hevy workouts into data/logs/ at the end of every training day and commits them
# straight to the default branch, so the repo is current mid-week without spending Claude
# tokens on it. Pure data mirror: no Anthropic call, no plan edits, no Sheet push — those
# stay with the Saturday weekly review.
#
# Training days: D1 Mon · D2 Tue · D3 Thu · D4 Fri, trained 6–7am ET. GitHub cron is UTC
# with no DST, so one schedule at 04:30 UTC lands at 00:30 EDT in summer and 23:30 EST in
# winter — after the training day either way, before the next. No time guard is needed: the
# sync is idempotent and a run with nothing new commits nothing, so a late or repeated
# firing is harmless. (D4 occasionally slips to Saturday; the Saturday review syncs too.)
#
# A failed Hevy call fails the job red and commits nothing. The logic lives in
# scripts/hevy/commit_log_sync.sh so it can be tested without the API.
on:
  schedule:
    - cron: "30 4 * * 2,3,5,6"   # the nights after Mon, Tue, Thu, Fri
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hevy-log-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The default branch even for a manual run dispatched from elsewhere: the log is
          # committed straight to it.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Sync from Hevy and commit
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/hevy/commit_log_sync.sh
